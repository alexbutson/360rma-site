# Cloudflare Worker — passphrase-gated GitHub proxy for the 360rma-site editor.
#
# Deploy (with Node/wrangler):
#   cd worker && npm install && npx wrangler deploy
# Or deploy via the Cloudflare dashboard (no Node needed) — see ../admin/README.md.
#
# Secrets (NEVER commit these):
#   npx wrangler secret put GITHUB_TOKEN        # repo token (kept server-side only)
#   npx wrangler secret put EDITOR_PASSPHRASE   # the passphrase you give the editor
#
# After deploy you get a URL like https://rma-editor.<subdomain>.workers.dev
# Paste it into admin/index.html -> CONFIG.workerUrl

name = "rma-editor"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Only this origin is served / allowed in CORS (scheme + host, no path).
ALLOWED_ORIGIN = "https://alexbutson.github.io"

# Which file the editor reads/writes.
REPO_OWNER  = "alexbutson"
REPO_NAME   = "360rma-site"
REPO_BRANCH = "main"
REPO_PATH   = "index.html"

# Secrets are set separately (see comments above) — never in this file:
#   GITHUB_TOKEN, EDITOR_PASSPHRASE
